name: front-blog-sprint0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sprint0_test
      POSTGRES_PASSWORD: sprint0_test_only
      POSTGRES_DB: sprint0_blog_test
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint0_test -d sprint0_blog_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"

volumes:
  postgres_test:
